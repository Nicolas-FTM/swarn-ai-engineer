[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires local_tz to be set to True below
# timezone =

# if true, use non-qualified names for all schema objects in generated
# migrations; if false, use full names (schema.table_name)
# this will make the migrations work properly with multiple
# schemas, and with alembic's "--x-include_schema_names" feature.  Otherwise,
# a single schema should be specified using "--x-schema" (see #312)
# include_object = True

# sqlalchemy url to use for migrations
# If not specified, it will be read from the environment.
# sqlalchemy.url = driver://user:pass@localhost/dbname

# if true, use the current timestamp for the revision identifier
# (this means a new file is generated for every revision, even if unmodified)
# use_timestamps = True

# if true, generate migration scripts that will use alembic's "autogenerate"
# feature to determine differences between database schema and models
# This feature relies on the metadata being loaded by the env.py script,
# and will generate the diff as part of the revision generation process.
# autogenerate = False

# if true, show SQL in the console when running commands
# echo = False

# if true, show the full traceback when an error occurs
# quiet = False

# if true, enable support for multi-head migrations
# multiple_heads = False

# if true, include all tables from all schemas when using autogenerate
# include_schemas = False

# if true, enable the "revision" command to generate a new revision
# revision_environment = False

# a list of modules that should be searched for custom types,
# when using autogenerate
# include_types =

# a list of regular expressions that will be ignored when
# comparing table names when running autogenerate
# exclude_tables =

# a list of regular expressions that will be ignored when
# comparing column names when running autogenerate
# exclude_columns =

# a list of regular expressions that will be ignored when
# comparing index names when running autogenerate
# exclude_indices =

# a list of regular expressions that will be ignored when
# comparing constraint names when running autogenerate
# exclude_constraints =

# a list of regular expressions that will be ignored when
# comparing sequences when running autogenerate
# exclude_sequences =

# a list of regular expressions that will be ignored when
# comparing triggers when running autogenerate
# exclude_triggers =

# a list of regular expressions that will be ignored when
# comparing events when running autogenerate
# exclude_events =

# a list of regular expressions that will be ignored when
# comparing roles when running autogenerate
# exclude_roles =

# a list of regular expressions that will be ignored when
# comparing collations when running autogenerate
# exclude_collations =

# a list of regular expressions that will be ignored when
# comparing extensions when running autogenerate
# exclude_extensions =

# a list of regular expressions that will be ignored when
# comparing views when running autogenerate
# exclude_views =

# a list of regular expressions that will be ignored when
# comparing materialized views when running autogenerate
# exclude_materialized_views =

# a list of regular expressions that will be ignored when
# comparing functions when running autogenerate
# exclude_functions =

# a list of regular expressions that will be ignored when
# comparing procedures when running autogenerate
# exclude_procedures =

# a list of regular expressions that will be ignored when
# comparing domains when running autogenerate
# exclude_domains =

# a list of regular expressions that will be ignored when
# comparing types when running autogenerate
# exclude_types =

# a list of regular expressions that will be ignored when
# comparing enums when running autogenerate
# exclude_enums =

# a list of regular expressions that will be ignored when
# comparing sequences when running autogenerate
# exclude_sequences =

# a list of regular expressions that will be ignored when
# comparing triggers when running autogenerate
# exclude_triggers =

# a list of regular expressions that will be ignored when
# comparing events when running autogenerate
# exclude_events =

# a list of regular expressions that will be ignored when
# comparing roles when running autogenerate
# exclude_roles =

# a list of regular expressions that will be ignored when
# comparing collations when running autogenerate
# exclude_collations =

# a list of regular expressions that will be ignored when
# comparing extensions when running autogenerate
# exclude_extensions =

# a list of regular expressions that will be ignored when
# comparing views when running autogenerate
# exclude_views =

# a list of regular expressions that will be ignored when
# comparing materialized views when running autogenerate
# exclude_materialized_views =

# a list of regular expressions that will be ignored when
# comparing functions when running autogenerate
# exclude_functions =

# a list of regular expressions that will be ignored when
# comparing procedures when running autogenerate
# exclude_procedures =

# a list of regular expressions that will be ignored when
# comparing domains when running autogenerate
# exclude_domains =

# a list of regular expressions that will be ignored when
# comparing types when running autogenerate
# exclude_types =

# a list of regular expressions that will be ignored when
# comparing enums when running autogenerate
# exclude_enums =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S