global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "swarn-monitor"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus Service
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    relabel_configs:
      - source_labels: [job]
        target_label: service_name

  # Backend Service
  - job_name: "backend"
    metrics_path: /metrics/ 
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - source_labels: [job]
        target_label: service_name

  # RAG Service
  - job_name: "rag-service"
    metrics_path: /metrics/
    static_configs:
      - targets: ["rag-service:8001"]
    relabel_configs:
      - source_labels: [job]
        target_label: service_name

  # QDrant Service
  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    relabel_configs:
      - source_labels: [job]
        target_label: service_name

  # Node Exporter Service
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [job]
        target_label: service_name
