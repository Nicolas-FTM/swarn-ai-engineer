global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "swarn-monitor"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
