########################################
# Grafana PersistentVolumeClaim
# Storage for Grafana dashboards and data
########################################

---
apiVersion: v1 # Define which Kubernetes API ruleset is used for this resource
kind: PersistentVolumeClaim # Type of Kubernetes Object. PVC requests storage resources
metadata:
  name: grafana-pvc # PVC name
  namespace: swarn-ai # Namespace where PVC runs
spec:
  accessModes:
    - ReadWriteOnce # Only one pod can write at a time
  resources:
    requests:
      storage: 5Gi # Disk size for Grafana data and dashboards

########################################
# Grafana Deployment
# Metrics visualization and dashboarding
########################################

---
apiVersion: apps/v1 # Define which Kubernetes API ruleset is used for this resource
kind: Deployment # Type of Kubernetes Object. Deployment manages Grafana instance
metadata:
  name: grafana # Name of the deployment (like container_name in Compose)
  namespace: swarn-ai # Namespace where deployment runs
spec:
  replicas: 1 # Single Grafana instance
  selector:
    matchLabels:
      app: grafana # Connects Deployment with Pods
  template:
    metadata:
      labels:
        app: grafana # Label used by Service to find this pod
    spec:
      containers:
      - name: grafana # Container name (like service name in Compose)
        image: grafana/grafana:latest # Grafana visualization platform
        ports:
        - containerPort: 3000 # Grafana web UI port
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD # Admin password from secret
          valueFrom:
            secretKeyRef:
              name: grafana-secrets # Secret containing admin password
              key: admin-password
        - name: GF_SECURITY_ADMIN_USER # Default admin username
          value: "admin"
        volumeMounts:
        - name: grafana-storage # Mount persistent storage
          mountPath: /var/lib/grafana # Grafana data directory
        resources: # Define resource requests and limits for the container
          requests: # Minimum resources guaranteed
            memory: "256Mi" # Minimum memory allocation
            cpu: "100m" # Minimum CPU allocation
          limits: # Maximum resources allowed
            memory: "512Mi" # Maximum memory limit
            cpu: "500m" # Maximum CPU limit
      volumes:
      - name: grafana-storage # Reference persistent volume
        persistentVolumeClaim:
          claimName: grafana-pvc # Link to PVC

########################################
# Grafana Service
# Exposes Grafana deployment internally
########################################

---
apiVersion: v1 # Define which Kubernetes API ruleset is used for this resource
kind: Service # Type of Kubernetes Object. Service exposes Grafana as a network service
metadata:
  name: grafana # Service name for DNS resolution
  namespace: swarn-ai # Namespace where service runs
spec:
  selector:
    app: grafana # Route traffic to pods with this label
  ports:
  - port: 3000 # Service port
    targetPort: 3000 # Pod port
  type: ClusterIP # Internal service, not exposed outside cluster
